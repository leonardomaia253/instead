name: Production Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Compile contracts
        run: pnpm contracts:compile

      - name: Contract tests
        run: pnpm contracts:test

      - name: Edge Function checks
        run: pnpm edge:functions:check

      - name: Database migration checks
        run: pnpm db:migrations:check

      - name: Supabase contract checks
        run: pnpm db:contract:check

      - name: Secret scan
        run: pnpm secrets:check

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://instead.finance' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

      - name: Local smoke tests
        run: pnpm smoke:local
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://instead.finance' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Strict EVM production gate
        run: pnpm production:gate
        env:
          PRODUCTION_TARGET: evm
          REQUIRE_STRICT_PRODUCTION_GATE: 'true'
          REQUIRE_EXTERNAL_AUDIT: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_FACTORY_ARBITRUM: ${{ vars.NEXT_PUBLIC_FACTORY_ARBITRUM }}
          NEXT_PUBLIC_FACTORY_POLYGON: ${{ vars.NEXT_PUBLIC_FACTORY_POLYGON }}
          NEXT_PUBLIC_FACTORY_BSC: ${{ vars.NEXT_PUBLIC_FACTORY_BSC }}
          NEXT_PUBLIC_FACTORY_BASE: ${{ vars.NEXT_PUBLIC_FACTORY_BASE }}
          NEXT_PUBLIC_FACTORY_OPTIMISM: ${{ vars.NEXT_PUBLIC_FACTORY_OPTIMISM }}
          NEXT_PUBLIC_FACTORY_MAINNET: ${{ vars.NEXT_PUBLIC_FACTORY_MAINNET }}
          NEXT_PUBLIC_FACTORY_AVALANCHE: ${{ vars.NEXT_PUBLIC_FACTORY_AVALANCHE }}
          REQUIRE_TELEGRAM_BOT: ${{ vars.REQUIRE_TELEGRAM_BOT || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://instead.finance' }}
          NEXT_PUBLIC_ENABLE_PRODUCTION_LENDING: ${{ vars.NEXT_PUBLIC_ENABLE_PRODUCTION_LENDING || 'false' }}
          NEXT_PUBLIC_LENDING_POOL_ADDRESS: ${{ vars.NEXT_PUBLIC_LENDING_POOL_ADDRESS }}
          NEXT_PUBLIC_LENDING_ROUTER_ADDRESS: ${{ vars.NEXT_PUBLIC_LENDING_ROUTER_ADDRESS }}
          REQUIRE_MULTI_PROTOCOL_LENDING: ${{ vars.REQUIRE_MULTI_PROTOCOL_LENDING || 'false' }}
          AAVE_SUPPORTED_ASSETS_JSON: ${{ vars.AAVE_SUPPORTED_ASSETS_JSON }}
          AAVE_ATOKENS_JSON: ${{ vars.AAVE_ATOKENS_JSON }}
          AAVE_VARIABLE_DEBT_TOKENS_JSON: ${{ vars.AAVE_VARIABLE_DEBT_TOKENS_JSON }}
          REQUIRE_LENDING_FORK_TEST: ${{ vars.REQUIRE_LENDING_FORK_TEST || 'true' }}
          HARDHAT_FORK_RPC_URL: ${{ secrets.HARDHAT_FORK_RPC_URL }}
          AAVE_POOL_ADDRESSES_PROVIDER: ${{ vars.AAVE_POOL_ADDRESSES_PROVIDER }}
          PRODUCTION_MULTISIG_ADDRESS: ${{ vars.PRODUCTION_MULTISIG_ADDRESS }}
          INCIDENT_PAUSE_RUNBOOK_URL: ${{ vars.INCIDENT_PAUSE_RUNBOOK_URL }}
          REQUIRE_DEPLOYMENT_MANIFEST: 'true'
          REQUIRE_OWNERSHIP_VERIFICATION: 'true'
          DEPLOYMENT_NETWORK: ${{ vars.DEPLOYMENT_NETWORK }}
          DEPLOYMENT_RPC_URL: ${{ secrets.DEPLOYMENT_RPC_URL }}


  solana-production:
    if: ${{ vars.REQUIRE_SOLANA_PRODUCTION == 'true' }}
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:0.31.1
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Solana production configuration
        run: pnpm solana:check
        env:
          REQUIRE_SOLANA_PRODUCTION: 'true'
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          NEXT_PUBLIC_SOLANA_FACTORY_PROGRAM_ID: ${{ vars.NEXT_PUBLIC_SOLANA_FACTORY_PROGRAM_ID }}

      - name: Require configured Solana toolchain
        run: |
          anchor --version
          solana --version
          cargo --version

      - name: Build and test Solana program
        run: |
          pnpm solana:build
          pnpm solana:test
        env:
          ANCHOR_PROVIDER_URL: ${{ secrets.SOLANA_RPC_URL }}
          NEXT_PUBLIC_SOLANA_FACTORY_PROGRAM_ID: ${{ vars.NEXT_PUBLIC_SOLANA_FACTORY_PROGRAM_ID }}
